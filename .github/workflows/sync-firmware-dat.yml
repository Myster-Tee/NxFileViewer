name: Sync Nintendo Switch Firmware DAT

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Sync firmware DAT
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 fw/sync_firmware_dat.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- fw/)" ]; then
            echo 'No new firmware releases found.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add fw/
          git commit -m 'Update Nintendo Switch firmware DAT and hashes'
          git push
